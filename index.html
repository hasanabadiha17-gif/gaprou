<style>
:root{--bg:#fff8f3;--card:#fff;--tx:#2b2140;--mut:#7a6f8c;--or:#ff9f6b;--pu:#8e6bd6;--bd:#eadff5;--tile:#f3ebfb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17121f;--card:#221b30;--tx:#f4edff;--mut:#a79bbd;--bd:#392d52;--tile:#2d2342}}
:root[data-theme=dark]{--bg:#17121f;--card:#221b30;--tx:#f4edff;--mut:#a79bbd;--bd:#392d52;--tile:#2d2342}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;font-size:14px}
button,input,select{font:inherit;color:inherit}
.grad{background:linear-gradient(135deg,var(--or),var(--pu));color:#fff}
.btn{border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:9px 14px;cursor:pointer}
.btn.p{background:linear-gradient(135deg,var(--or),var(--pu));color:#fff;border:0;font-weight:600}
.btn.on{background:var(--pu);color:#fff;border-color:var(--pu)}.btn.off{background:#e5484d;color:#fff;border-color:#e5484d}
.btn:disabled{opacity:.4;cursor:not-allowed}
#home{display:flex;align-items:center;justify-content:center;min-height:100%;padding:16px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:28px;max-width:430px;width:100%;box-shadow:0 12px 40px #8e6bd622;text-align:center}
.box h1{margin:0 0 4px;font-size:28px;background:linear-gradient(135deg,var(--or),var(--pu));-webkit-background-clip:text;background-clip:text;color:transparent}
.box p{color:var(--mut);margin:4px 0 18px}
.box input{width:100%;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);margin-bottom:10px;text-align:center}
.box .btn{width:100%;margin-top:6px}
#app{display:none;height:100%;flex-direction:column}
header{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--card);flex-wrap:wrap}
header b{background:linear-gradient(135deg,var(--or),var(--pu));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:18px}
.sp{flex:1}
main{flex:1;display:flex;min-height:0}
#grid{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));grid-auto-rows:minmax(160px,1fr);gap:10px;padding:10px;overflow:auto}
.tile{position:relative;background:var(--tile);border-radius:16px;overflow:hidden;border:2px solid transparent;display:flex;align-items:center;justify-content:center}
.tile.sh{grid-column:1/-1}.tile.talk{border-color:var(--or)}
.tile video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;background:#000}.tile.sh video{object-fit:contain}
.av{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}
.lab{position:absolute;bottom:8px;right:8px;left:8px;display:flex;gap:6px;align-items:center;z-index:2}
.lab span{background:#000a;color:#fff;border-radius:8px;padding:2px 8px;font-size:12px}
aside{width:320px;border-inline-end:1px solid var(--bd);background:var(--card);display:flex;flex-direction:column;order:2}
.tabs{display:flex;border-bottom:1px solid var(--bd)}.tabs button{flex:1;border:0;background:none;padding:10px;cursor:pointer;color:var(--mut)}
.tabs button.a{color:var(--pu);border-bottom:2px solid var(--or);font-weight:600}
.pane{display:none;flex:1;flex-direction:column;min-height:0;padding:10px}.pane.a{display:flex}
.list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px}
.msg{background:var(--tile);border-radius:12px;padding:7px 10px;max-width:92%;word-break:break-word}.msg.me{background:linear-gradient(135deg,#ffb48a55,#8e6bd655);align-self:flex-start}
.msg small{display:block;color:var(--mut);font-size:11px}
.row{display:flex;gap:6px;margin-top:8px}.row input{flex:1;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--bg)}
.pr{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px dashed var(--bd)}.pr .n{flex:1}.pr .btn{padding:4px 8px;font-size:12px}
footer{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px;border-top:1px solid var(--bd);background:var(--card)}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--pu);color:#fff;padding:8px 16px;border-radius:12px;z-index:9;display:none}
@media(max-width:760px){main{flex-direction:column}aside{width:100%;height:42%;order:0;border-top:1px solid var(--bd)}}
:root{--g2:#f1e7ff}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--g2:#2a1d3f}}:root[data-theme=dark]{--g2:#2a1d3f}:root[data-theme=light]{--g2:#f1e7ff}
body{background:linear-gradient(120deg,var(--bg),var(--g2),var(--bg),var(--g2));background-size:300% 300%;animation:bgm 20s ease infinite}@keyframes bgm{50%{background-position:100% 50%}}
.btn{transition:.2s}.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 16px #8e6bd633}
.tile{transition:.3s;animation:pop .4s}.tile:hover{transform:scale(1.015)}@keyframes pop{from{opacity:0;transform:scale(.9)}}
.av{font-size:34px;width:76px;height:76px;box-shadow:0 0 0 4px #fff5}
.avs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}.av-b{font-size:22px;border:2px solid var(--bd);background:var(--bg);border-radius:12px;width:42px;height:42px;cursor:pointer;transition:.2s}.av-b.sel{border-color:var(--or);background:var(--tile);transform:scale(1.15)}
.inp,#prf input{width:100%;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);margin-bottom:8px}
.msg.m2{animation:pop .3s}.mh{display:flex;align-items:center;gap:6px}.mav{font-size:18px}.cimg{max-width:100%;max-height:200px;border-radius:10px;margin-top:4px;display:block}.stk{font-size:56px;animation:bnc 1s infinite;text-align:center}@keyframes bnc{50%{transform:translateY(-8px) rotate(8deg)}}
.sys{text-align:center;color:var(--mut);font-size:11px}
#ep{display:none;background:var(--tile);border-radius:12px;padding:8px;margin-top:6px}#ep.open{display:block}.eg{display:flex;flex-wrap:wrap;gap:2px}.eg button{border:0;background:none;font-size:22px;cursor:pointer;transition:.15s}.eg button:hover{transform:scale(1.3)}.eg.st button{font-size:30px}.stl{color:var(--mut);font-size:11px;margin:6px 0 2px}
.pp{align-items:flex-start}.pav{font-size:24px;width:40px;height:40px;border-radius:50%;background:var(--tile);display:flex;align-items:center;justify-content:center;flex:none}.det{color:var(--mut);line-height:1.8}
.rx{padding:9px 11px}.cs{color:#fff}
.fly{position:fixed;bottom:80px;font-size:38px;z-index:20;pointer-events:none;animation:fl 2.6s ease-out forwards}@keyframes fl{to{transform:translateY(-60vh) rotate(20deg);opacity:0}}
:root{--bg:#f5f3fa;--card:#fff;--tx:#1c1830;--mut:#6b6580;--or:#ff8a4c;--pu:#7c5cd6;--bd:#e4def0;--tile:#e9e4f5;--g2:#f5f3fa}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17121f;--card:#1f1a2b;--tx:#efeaff;--mut:#9a92b3;--bd:#2f2842;--tile:#2a2339;--g2:#17121f}}
:root[data-theme=dark]{--bg:#17121f;--card:#1f1a2b;--tx:#efeaff;--mut:#9a92b3;--bd:#2f2842;--tile:#2a2339;--g2:#17121f}
:root[data-theme=light]{--bg:#f5f3fa;--card:#fff;--tx:#1c1830;--mut:#6b6580;--bd:#e4def0;--tile:#e9e4f5;--g2:#f5f3fa}
body{animation:none;background:var(--bg)}
.btn{border-radius:10px;font-weight:500}.btn:hover:not(:disabled){transform:none;box-shadow:none;filter:brightness(1.07)}
.box{border-radius:16px;box-shadow:0 8px 30px #0001}header{padding:8px 16px}header b{font-size:17px}

function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}

async function gdl(fn,b){if(window.claude&&claude.use){try{const d=await claude.use('downloads');await d.save({filename:fn,data:b});return}catch(e){}}
  const u=URL.createObjectURL(b instanceof Blob?b:new Blob([b])),a=document.createElement('a');a.href=u;a.download=fn;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
const H={};
function send(t,d={}){d.from=me;try{room.emit(t,d)}catch(e){}}
function on(t,f){H[t]=f}
function wsNet(c){return new Promise(res=>{
  let ws,open=false,done=false,dead=false,n=0;const q=[];
  const url=(window.GAPROO_WS||((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws'))+'?room='+encodeURIComponent(c)+'&id='+me;
  const conn=()=>{try{ws=new WebSocket(url)}catch(e){if(!done){done=true;dead=true;res(null)}return}
    ws.onopen=()=>{open=true;q.splice(0).forEach(m=>ws.send(m));if(!done){done=true;res('ws')}else if(n++>=0)send('hello',{name,host:isHost,re:0})};
    ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m&&m.d&&m.d.from!==me&&H[m.t])H[m.t](m.d)}catch(x){}};
    ws.onclose=()=>{open=false;if(!done){done=true;dead=true;res(null);return}if(!dead)setTimeout(conn,1500)};ws.onerror=()=>{}};
  room={name:c,close(){dead=true;try{ws.close()}catch(e){}},emit:(t,d)=>{const m=JSON.stringify({t,d});open&&ws.readyState===1?ws.send(m):q.length<300&&q.push(m)}};
  conn();setTimeout(()=>{if(!done){done=true;dead=true;try{ws.close()}catch(e){}res(null)}},4000)})}
async function net(c){
  let r=null;try{const ns=window.claude&&await claude.use('room');if(ns)r=ns.join?await ns.join(c):ns}catch(e){}
  if(r){room=r;['hello','sig','chat','state','hand','share','file','bye','react','knock','admit','rec','kick','board','poll'].forEach(t=>r.on(t,m=>{if(m.isMe||!m.data||m.data.from===me)return;H[t]&&H[t](m.data)}));return 'room'}
  if(HOSTED){const m=await wsNet(c);if(m)return m}
  bc=new BroadcastChannel('gr-'+c);room={emit:(t,d)=>bc.postMessage({t,d})};
  bc.onmessage=e=>{const{t,d}=e.data;if(d.from!==me&&H[t])H[t](d)};return 'tab'}

async function start(c,host){
  name=($('#nm').value.trim()||'کاربر')+'';code=c;isHost=host;if(host)hostId=me;
  try{const s=await navigator.mediaDevices.getUserMedia({audio:true,video:true});mic=s.getAudioTracks()[0];cam=s.getVideoTracks()[0]}
  catch(e){try{const s=await navigator.mediaDevices.getUserMedia({audio:true});mic=s.getAudioTracks()[0]}catch(e2){}}
  if(!host&&mic)mic.enabled=false;
  [mic,cam].forEach(t=>t&&local.addTrack(t));
  const mode=await net(c);
  try{history.replaceState(null,'','#room='+c)}catch(e){}
  $('#home').style.display='none';$('#app').style.display='flex';$('#rc').textContent=(isHost?'میزبان · ':'مهمان · ')+'کد: '+c;
  if(isHost)$('#hc').style.display='block';
  if(mode==='tab')toast('حالت آزمایشی: فقط بین تب‌های همین مرورگر');
  if(!mic&&!cam)toast('به دوربین/میکروفون دسترسی نیست؛ فقط می‌توانید ببینید و چت کنید');
  send('hello',{name,host:isHost});render();
}
// ---- peers
function mk(id,nm){
  if(peers[id])return peers[id];
  const pc=new RTCPeerConnection(ICE),p={pc,name:nm,stream:new MediaStream(),hand:false,share:false,q:[],talk:false};peers[id]=p;
  p.a=pc.addTransceiver('audio');p.v=pc.addTransceiver('video');
  p.a.sender.replaceTrack(mic||null);p.v.sender.replaceTrack(scr?scr.getVideoTracks()[0]:cam||null);
  pc.ontrack=e=>{p.stream.addTrack(e.track);render()};
  pc.onicecandidate=e=>e.candidate&&send('sig',{to:id,c:e.candidate.toJSON()});
  pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed')render()};
  return p}
async function offer(id){const p=peers[id];await p.pc.setLocalDescription(await p.pc.createOffer());send('sig',{to:id,d:p.pc.localDescription.toJSON()})}
on('hello',d=>{const first=!peers[d.from];const p=mk(d.from,d.name);p.name=d.name;if(d.host)hostId=d.from;
  if(!d.re)send('hello',{name,host:isHost,re:1});
  if(me>d.from&&first)offer(d.from);
  if(isHost)send('state',st);sayHand();render()});
on('sig',async d=>{if(d.to!==me)return;const p=mk(d.from,'...');
  try{if(d.d){await p.pc.setRemoteDescription(d.d);p.q.forEach(c=>p.pc.addIceCandidate(c));p.q=[];
    if(d.d.type==='offer'){await p.pc.setLocalDescription(await p.pc.createAnswer());send('sig',{to:d.from,d:p.pc.localDescription.toJSON()})}}
  else if(d.c){p.pc.remoteDescription?p.pc.addIceCandidate(d.c):p.q.push(d.c)}}catch(e){}});
on('bye',d=>{const p=peers[d.from];if(p){p.pc.close();delete peers[d.from];render()}});
on('hand',d=>{const p=peers[d.from];if(p){p.hand=d.on;if(d.on)toast(''+p.name+' دستش را بالا برد');render()}});
on('share',d=>{const p=peers[d.from];if(p){p.share=d.on;render()}});
on('state',d=>{if(d.from!==hostId)return;st={mode:d.mode,allowed:d.allowed};applyTalk();render()});
function sayHand(){if(hand)send('hand',{on:true});if(scr)send('share',{on:true})}

  if(ok&&st.allowed.includes(me)&&!isHost&&hand){hand=false;send('hand',{on:false});toast('میزبان اجازه صحبت داد')}}

  e.querySelector('button').onclick=async()=>{try{await gdl(fn,blob)}catch(x){toast('دانلود ممکن نشد')}};$('#fl').append(e)}

function tile(id,n,stream,o){const c=colors[n.charCodeAt(0)%5];
  return `<div class="tile ${o.sh?'sh':''} ${o.talk?'talk':''}" data-id="${id}"><div class="av" style="background:${c}">${esc(n[0]||'?')}</div><video autoplay playsinline ${o.self?'muted':''}></video>
  <div class="lab"><span>${esc(n)}${o.self?' (شما)':''}</span>${o.host?'<span>'+RI('host')+'میزبان</span>':''}${(st.pres||[]).includes(id==='me'?me:id)&&!o.host?'<span>'+RI('pres')+'ارائه‌دهنده</span>':''}${o.hand?'<span>'+RI('hand')+'دست بالا</span>':''}${o.mute?'<span>'+RI('mute')+'</span>':''}</div></div>`}
function render(){
  const g=$('#grid');let h=tile('me',name||'',local,{self:1,host:isHost,hand,sh:!!scr,mute:!mic||!mic.enabled});
  Object.entries(peers).forEach(([id,p])=>h+=tile(id,p.name,p.stream,{host:id===hostId,hand:p.hand,sh:p.share,mute:false}));
  g.innerHTML=h;
  g.querySelectorAll('.tile').forEach(t=>{const id=t.dataset.id,v=t.querySelector('video');
    const s=id==='me'?(scr?new MediaStream([scr.getVideoTracks()[0]]):new MediaStream(cam?[cam]:[])):peers[id].stream;
    v.srcObject=s;v.style.display=s.getVideoTracks().length&&(id!=='me'||scr||cam.enabled)?'block':'none';if(id!=='me')v.play().catch(()=>{})});
  const mo=mic&&mic.enabled;$('#bm').className='btn '+(mo?'on':'off');$('#bm').textContent=mo?'🎤 میکروفون روشن':'🔇 میکروفون خاموش';
  $('#bc').className='btn '+(cam&&cam.enabled?'on':'off');$('#bs').className='btn '+(scr?'on':'');$('#bs').textContent=scr?'⏹ توقف اشتراک':'🖥️ اشتراک صفحه';
  $('#bh').className='btn '+(hand?'on':'');$('#bh').textContent=hand?'✋ پایین آوردن دست':'✋ بالا بردن دست';
  $('#mode').textContent=st.mode==='free'?'حالت: همه می‌توانند صحبت کنند (برای تغییر بزنید)':'حالت: فقط با اجازه میزبان (برای تغییر بزنید)';
  $('#cnt').textContent='('+(Object.keys(peers).length+1)+')';
  let l=`<div class="pr"><span class="n">${esc(name||'')} (شما) ${isHost?' میزبان':''} ${hand?' دست بالا':''}</span></div>`;
  Object.entries(peers).forEach(([id,p])=>{const al=st.allowed.includes(id);
    l+=`<div class="pr"><span class="n">${esc(p.name)} ${id===hostId?' میزبان':''} ${p.hand?' دست بالا':''}</span>${isHost&&id!==hostId?`<button class="btn ${al?'on':''}" data-a="${id}">${al?'قطع صدا':'اجازه صحبت'}</button>`:''}</div>`});

$('#lnm').value=PROF.nm||'';$('#lti').value=PROF.ti||'';if(hash)$('#lcode').value=hash[1];
wire('#lup','#lfi','#lsh');$('#lnm').addEventListener('input',avUI);
function sync(){L.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('a',b.dataset.s===tab));$('#lcode').style.display=tab==='g'?'block':'none';$('#lgo').textContent=tab==='h'?'ساخت جلسه جدید':'ورود به جلسه';avUI()}
L.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{tab=b.dataset.s;sync()});sync();
function chip(id,on,t){const e=$(id);e.classList.toggle('off',!on);e.textContent=t+(on?' روشن':' خاموش')}
$('#lcm').onclick=()=>{cam1=!cam1;chip('#lcm',cam1,'دوربین')};$('#lmc').onclick=()=>{mic1=!mic1;chip('#lmc',mic1,'میکروفون')};

function ok(){return 'Notification' in window}
function ask(){if(ok()&&Notification.permission==='default'){try{const r=Notification.requestPermission();r&&r.then&&r.then(p=>{if(p==='granted')show('گپ‌رو فعال شد','از این به بعد پیام‌ها و ورود افراد را اطلاع می‌دهیم',true)})}catch(e){}}}
async function show(t,body,force){if(!ok()||Notification.permission!=='granted')return;if(!force&&!document.hidden)return;
 const o={body,icon:ICON,badge:ICON,tag:'gaprou',renotify:true,dir:'rtl',lang:'fa'};
 try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(reg){return reg.showNotification(t,o)}}catch(e){}
 try{const n=new Notification(t,o);n.onclick=()=>{window.focus();n.close()}}catch(e){}}
function bump(){if(document.hidden){unread++;document.title='('+unread+') '+base}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){unread=0;document.title=base}});
['create','join'].forEach(id=>{const e=document.getElementById(id);e&&e.addEventListener('click',ask)});
try{if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
const w=(t,f)=>{try{const pv=H[t];on(t,d=>{pv&&pv(d);try{f(d)}catch(e){}})}catch(e){}};
w('chat',d=>{if(d.from===me)return;bump();show(NAME+' · '+(d.name||''),d.k==='st'?'استیکر فرستاد':String(d.t||'').slice(0,80))});
w('hello',d=>{if(d.re||d.from===me)return;bump();show(NAME,(d.name||'کسی')+' وارد جلسه شد')});
w('knock',d=>{if(isHost){bump();show(NAME,(d.name||'کسی')+' منتظر ورود است')}});
w('hand',d=>{if(d.on&&peers[d.from]){bump();show(NAME,peers[d.from].name+' دستش را بالا برد')}});
w('file',d=>{if(d.i===0&&d.from!==me){bump();show(NAME,'فایل جدید از '+(d.name||''))}});
})();

(()=>{let dp=null,wl=null;const ib=document.getElementById('inst');
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;if(ib)ib.style.display='block'});
if(ib)ib.onclick=async()=>{if(!dp)return;dp.prompt();try{await dp.userChoice}catch(e){}dp=null;ib.style.display='none'};
addEventListener('appinstalled',()=>{if(ib)ib.style.display='none'});
async function lock(){try{if('wakeLock' in navigator&&!document.hidden&&$('#app').style.display==='flex')wl=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',lock);setInterval(()=>{if(!wl||wl.released)lock()},15000);
addEventListener('pagehide',()=>{try{room&&room.close&&room.close()}catch(e){}});
})();
